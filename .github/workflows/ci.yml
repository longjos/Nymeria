name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      # No submodules: the wiki submodule may use SSH URLs and is not needed for CI.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Frontend must be built first: web/build/ is embedded via go:embed,
      # so go vet/test fail if it does not exist.
      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Desktop shell must keep cross-compiling from Linux (pure-Go Windows
      # target); catches Wails/API breakage without GUI deps on the runner.
      - name: Desktop compile gate (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o /dev/null ./cmd/nymeria-desktop
