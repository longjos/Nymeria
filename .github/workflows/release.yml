name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          dry-run: build artifacts + preview notes only.
          tag-release: bump version with git-cliff, tag HEAD, draft a release.
        type: choice
        default: dry-run
        options:
          - dry-run
          - tag-release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git-cliff needs the full history and all tags to group commits
          # per release and compute the next version.
          fetch-depth: 0
          fetch-tags: true
        # No submodules on purpose: the wiki submodule isn't needed for the
        # build and may reference an SSH URL that CI can't fetch.

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # web/build/ now exists, so the go:embed directive resolves.
      - name: Run Go tests
        run: go test ./...

      - name: Determine mode and version
        id: version
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            MODE="tag-push"
            VERSION="${GITHUB_REF_NAME}"
          else
            MODE="${INPUT_MODE:-dry-run}"
            if [[ "$MODE" == "tag-release" ]]; then
              VERSION="$(git cliff --bumped-version)"
              LATEST="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
              if [[ ! "$VERSION" =~ ^v[0-9] ]]; then
                echo "::error::git-cliff --bumped-version returned '$VERSION', which does not look like a version tag." >&2
                exit 1
              fi
              if [[ "$VERSION" == "$LATEST" ]]; then
                echo "::error::No releasable commits since $LATEST — nothing to release." >&2
                exit 1
              fi
            else
              VERSION="dev-$(git rev-parse --short HEAD)"
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE, version: $VERSION"

      - name: Generate release notes
        env:
          MODE: ${{ steps.version.outputs.mode }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          case "$MODE" in
            tag-push)
              # Notes for the tag that was just pushed (HEAD is at the tag).
              git cliff --current -o release-notes.md
              ;;
            tag-release)
              git cliff --unreleased --tag "$VERSION" -o release-notes.md
              ;;
            dry-run)
              # Preview rendering with a placeholder tag; uploaded as an artifact.
              git cliff --unreleased --tag v99.99.99 -o release-notes.md
              ;;
          esac
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Cross-compile binaries
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          LDFLAGS="-s -w -X main.version=${VERSION}"
          GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o nymeria-linux-amd64 ./cmd/nymeria
          GOOS=linux   GOARCH=arm64 go build -ldflags "$LDFLAGS" -o nymeria-linux-arm64 ./cmd/nymeria
          GOOS=darwin  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o nymeria-darwin-amd64 ./cmd/nymeria
          GOOS=darwin  GOARCH=arm64 go build -ldflags "$LDFLAGS" -o nymeria-darwin-arm64 ./cmd/nymeria
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o nymeria.exe ./cmd/nymeria

      - name: Build desktop (windows/amd64)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          GOOS=windows GOARCH=amd64 go build \
            -ldflags "-s -w -H=windowsgui -X main.version=${VERSION}" \
            -o Nymeria-desktop-windows-amd64.exe ./cmd/nymeria-desktop

      - name: Generate checksums
        run: sha256sum nymeria-linux-amd64 nymeria-linux-arm64 nymeria-darwin-amd64 nymeria-darwin-arm64 nymeria.exe Nymeria-desktop-windows-amd64.exe > checksums.txt

      # Draft on purpose: the maintainer polishes the notes and publishes by hand.
      # On tag-release, `gh release create` also creates the tag on HEAD.
      - name: Create draft GitHub release
        if: steps.version.outputs.mode != 'dry-run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --draft \
            --notes-file release-notes.md \
            --title "$VERSION" \
            nymeria-linux-amd64 \
            nymeria-linux-arm64 \
            nymeria-darwin-amd64 \
            nymeria-darwin-arm64 \
            nymeria.exe \
            Nymeria-desktop-windows-amd64.exe \
            checksums.txt

      # dry-run is verification mode: no release, just artifacts + notes preview.
      - name: Upload build artifacts
        if: steps.version.outputs.mode == 'dry-run'
        uses: actions/upload-artifact@v4
        with:
          name: nymeria-${{ steps.version.outputs.version }}
          path: |
            nymeria-linux-amd64
            nymeria-linux-arm64
            nymeria-darwin-amd64
            nymeria-darwin-arm64
            nymeria.exe
            Nymeria-desktop-windows-amd64.exe
            checksums.txt
            release-notes.md
