# Nymeria APRS Client Configuration

server:
  listen: ":8080"

# Station identity and tracker tuning
station:
  callsign: "N0CALL"
  ssid: 0
  # lat: 35.0
  # lon: -106.0
  # symbol_table: "/"
  # symbol_code: "-"
  # comment: "Nymeria APRS Client"
  track_max_points: 100
  stale_timeout: 80m
  dedup_window: 30s
  # New-N AX.25 path. Empty = direct. Common: WIDE1-1,WIDE2-1 (mobile),
  # WIDE2-1 (fixed), WIDE1-1,WIDE2-2 (rural), TCPIP* (APRS-IS only).
  message_path: "WIDE1-1,WIDE2-1"
  beacon_path: "WIDE1-1,WIDE2-1"

# Transport connections
transports:
  # APRS-IS connection
  # - type: aprsis
  #   host: rotate.aprs2.net
  #   port: 14580
  #   filter: "r/35.0/-106.0/100"

  # KISS TCP (e.g., Direwolf). Prefer Settings → Transports (mDNS + localhost:8001).
  # Direwolf 1.7+ on Linux/macOS advertises _kiss-tnc._tcp ("Dire Wolf on hostname").
  # Windows Direwolf does not advertise — use localhost:8001 if it is on this PC.
  # - type: kisstcp
  #   host: localhost
  #   port: 8001          # KISS, not AGWPE 8000

  # Serial KISS TNC (hardware TNC, Kenwood TH-D74/D75 USB or Bluetooth, Mobilinkd)
  # Prefer Settings → Transports (port picker) over guessing a path.
  # Windows: COM5  (Device Manager → Ports → "TH-D74 (COM5)" after Kenwood USB CDC VCP)
  #          Install the Kenwood VCP driver BEFORE first plug — not Silicon Labs CP210x.
  # Linux:   /dev/serial/by-id/usb-…  (stable) or /dev/ttyACM0 / /dev/ttyUSB0
  #          Motherboard /dev/ttyS* is omitted from the picker; type it manually if needed.
  # macOS:   /dev/cu.usbmodem*
  # TH-D74:  [F][LIST] until KISS+1200 / KISS+9600. Never send KISS ON/RESTART.
  #          Menu 505 is the on-air 1200/9600 rate. Menu 980 Mass Storage removes the COM port.
  # - type: serial
  #   device: COM5
  #   baud: 9600          # USB CDC usually ignores this. Bluetooth SPP often 115200.
  #                       # NOT the same as Kenwood Menu 505 (RF).

# Storage
store:
  path: "./nymeria.db"

# Logging
logging:
  level: "info"  # debug, info, warn, error

# Live GPS — tracks the host machine's position.
# Disabled by default; everything GPS-related is hidden in the UI when off.
gps:
  enabled: false
  # gpsd (recommended on Linux/RPi), nmea (direct serial/TCP NMEA-0183),
  # or modemmanager (GNSS inside an LTE modem, via ModemManager on D-Bus)
  type: gpsd
  # gpsd, or NMEA-over-TCP:
  host: 127.0.0.1
  port: 2947
  # NMEA over serial (leave host empty and set these instead):
  # type: nmea
  # device: /dev/ttyACM0
  # baud: 9600
  # GNSS inside a WWAN modem (Linux only — e.g. the Sierra EM7455 in a
  # Panasonic CF-20). Needs ModemManager >= 1.10 (1.18+ recommended) and a
  # polkit rule; see the ModemManager GPS wiki page.
  #   type: modemmanager
  #   device: ""   # blank = first GPS-capable modem; or "0", or a full
  #                # D-Bus object path like
  #                # /org/freedesktop/ModemManager1/Modem/0
  # host/port/baud are ignored for modemmanager.
  # Ignore fixes arriving faster than this.
  min_interval: 1s
  # A fix older than this is "stale": beacon falls back to station.lat/lon
  # and the UI dims the own-position marker.
  stale_after: 30s
  # Use a fresh live fix for beacons instead of station.lat/lon.
  use_for_beacon: true

beacon:
  enabled: false
  interval: 10m
  comment: ""
  # Smart beaconing needs a live GPS (speed/course). Ignored without one.
  # smart_beacon:
  #   enabled: true
  #   fast_speed: 60      # mph
  #   slow_speed: 5       # mph
  #   fast_rate: 60s
  #   slow_rate: 30m
  #   turn_angle: 28      # degrees
  #   turn_slope: 26

# what3words — resolve three-word addresses heard on the radio into map pins.
# Get a free key at https://accounts.what3words.com (Developer plan).
# The key stays on the server; the browser only ever sees resolved coordinates.
# Enabled but inert until a key exists — paste one in Settings → what3words
# and it works live, no restart.
what3words:
  enabled: true
  api_key: ""                                # or NYMERIA_W3W_API_KEY
  base_url: "https://api.what3words.com/v3"  # override to point at a mock/proxy (or NYMERIA_W3W_BASE_URL)
  results: 5          # autosuggest rows (1-10)
  forward_ttl: 24h    # cache for words->coords and coords->words
  suggest_ttl: 5m     # cache for autosuggest

# NWS weather watches, warnings and advisories (api.weather.gov). Off by
# default; enabling requires a contact (NWS User-Agent policy — see
# https://www.weather.gov/documentation/services-web-api), an email or a
# callsign+website both work. Everything here is live-reloadable, no restart.
# This is NOT the weather-station reading thresholds below (weather.alerts) —
# "alert" here means an actual NWS watch/warning/advisory.
wx_alerts:
  enabled: false
  contact: ""                        # or NYMERIA_WX_CONTACT; required when enabled
  base_url: ""                       # override to point at a mock (default https://api.weather.gov)
  poll_interval: 60s                 # 30s-10m
  default_buffer_miles: 10           # 2-50; how far "near" extends past the watch area
  # default_zones: ["MIC081"]        # extra always-watched UGC zone codes
  # NCS-editable per net (Net Control → weather watch area); this is the
  # seed allowlist for a fresh net. Extreme+Immediate+in-area alerts always
  # show at least a toast regardless of this list — that floor cannot be
  # turned off.
  interrupt_events:
    - "Tornado Warning"
    - "Flash Flood Emergency"
    - "Severe Thunderstorm Warning"
    - "Flash Flood Warning"
    - "Extreme Wind Warning"
    - "Ice Storm Warning"
    - "Blizzard Warning"
  watch_notify: toast       # toast | badge
  advisory_notify: badge    # badge | panel
  statement_notify: panel   # panel | badge
  sounds: true
  include_test: false       # include CAP status=Test/Exercise/System alerts (never Actual)
