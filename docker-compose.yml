services:
  nymeria:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./nymeria.yaml:/app/nymeria.yaml:ro
      - nymeria-data:/app/data
    restart: unless-stopped

  # Optional: Direwolf software TNC
  # direwolf:
